<!-- Vibe-Trading -- Research Goals board (traceable research to-dos). -->
<!doctype html>
<!-- Standalone wrapper: served RAW by ui_server (no injected scripts), so
     this page must load its own CSS and Alpine. See dashboard.html header. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Goals — Vibe-Trading</title>
  <link rel="stylesheet" href="dashboard.css" />
  <style>
    :root {
      --vibe-trading-accent: #4f8cff;
      --vibe-trading-accent-soft: rgba(79, 140, 255, 0.12);
    }
    body { margin: 0; padding: 12px 16px 32px; background: #14171c; color: #e6e8ea;
           font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
    [x-cloak] { display: none !important; }
    a { color: var(--vibe-trading-accent); }
    .vt-goal { border: 1px solid rgba(255,255,255,0.10); border-radius: 8px;
               padding: 12px 14px; margin: 10px 0; background: rgba(255,255,255,0.03); }
    .vt-goal h4 { margin: 0 0 6px; font-size: 14px; }
    .vt-goal .meta { color: #9aa0a6; font-size: 12px; margin-bottom: 8px; }
    .vt-ev { padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 12px; }
    .vt-ev .src { color: #9aa0a6; }
    select, input[type=text] { background: #1b1f26; color: #e6e8ea; border: 1px solid rgba(255,255,255,0.15);
               border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  </style>
</head>
<body>
<div style="margin: 0 0 10px; font-size: 12px;"><a href="/" title="Back to the Agent Zero chat">&larr; Agent Zero</a></div>
<div x-data="goalsPage()" x-init="init()" class="vt-page vt-goals" x-cloak>
  <header class="vt-page-header">
    <h2>Research Goals</h2>
    <p class="vt-subtitle">traceable research questions with evidence + lifecycle status</p>
  </header>
  <section class="vt-status" x-show="statusMessage" x-transition>
    <span x-text="statusMessage"></span>
    <button class="vt-btn vt-btn-text" @click="statusMessage = ''">dismiss</button>
  </section>

  <div class="vt-card">
    <h3>New research goal</h3>
    <div class="vt-form-row">
      <label class="vt-field"><span>Question *</span>
        <input type="text" x-model="form.question" placeholder="e.g. Does northbound flow predict HK close?" /></label>
    </div>
    <div class="vt-form-row">
      <label class="vt-field"><span>Hypothesis (optional)</span>
        <input type="text" x-model="form.hypothesis" placeholder="e.g. spikes > 2σ lead +1% next-day returns" /></label>
      <button class="vt-btn vt-btn-primary" @click="startGoal()" :disabled="form.loading">
        <span x-show="!form.loading">Create goal</span>
        <span x-show="form.loading">Creating...</span>
      </button>
    </div>
  </div>

  <div class="vt-card">
    <header class="vt-zoo-header">
      <h3>Goals</h3>
      <button class="vt-btn vt-btn-ghost vt-btn-small" @click="loadAll()" :disabled="loading">&circ; Refresh</button>
    </header>
    <p class="vt-meta" x-show="!loading && !goals.length">No goals yet — create one above.</p>

    <template x-for="g in goals" :key="goalId(g)">
      <div class="vt-goal">
        <h4 x-text="goalField(g, ['question', 'title'], '(untitled goal)')"></h4>
        <div class="meta">
          <span class="vt-pill" x-text="goalField(g, ['status'], 'unknown')"></span>
          &middot; id <code x-text="goalId(g)"></code>
          &middot; evidence: <span x-text="evidenceCount(g)"></span>
          &middot; <span x-text="goalField(g, ['created_at', 'created', 'started_at'], '')"></span>
        </div>
        <div x-show="evidenceList(g).length" style="margin-bottom: 8px;">
          <template x-for="(e, i) in evidenceList(g).slice(0, 5)" :key="i">
            <div class="vt-ev">
              <span x-text="typeof e === 'string' ? e : (e.text || e.evidence || JSON.stringify(e))"></span>
              <span class="src" x-show="e && e.source" x-text="' — ' + (e.source || '')"></span>
            </div>
          </template>
          <div class="src" x-show="evidenceList(g).length > 5" style="color:#9aa0a6; font-size:11px;">
            +<span x-text="evidenceList(g).length - 5"></span> more (open detail)
          </div>
        </div>
        <div class="vt-form-row" style="align-items: end;">
          <label class="vt-field"><span>Add evidence</span>
            <input type="text" x-model="evText[goalId(g)]" placeholder="what supports or refutes the hypothesis" /></label>
          <label class="vt-field vt-field-narrow"><span>Source</span>
            <input type="text" x-model="evSrc[goalId(g)]" placeholder="tool/report/URL" /></label>
          <button class="vt-btn vt-btn-ghost vt-btn-small" @click="addEvidence(g)" :disabled="evLoading === goalId(g)">Add</button>
          <label class="vt-field vt-field-narrow"><span>Status</span>
            <select :id="'st-' + goalId(g)" @change="setStatus(g, $event.target.value)">
              <option value="">change…</option>
              <option value="draft">draft</option>
              <option value="active">active</option>
              <option value="paused">paused</option>
              <option value="complete">complete</option>
              <option value="abandoned">abandoned</option>
            </select></label>
          <button class="vt-btn vt-btn-ghost vt-btn-small" @click="openDetail(g)">Detail</button>
        </div>
      </div>
    </template>
  </div>

  <div class="vt-card" x-show="detailId">
    <h3>Goal detail: <code x-text="detailId"></code></h3>
    <pre x-text="detailBody"></pre>
  </div>
</div>
<script>
function goalsPage() {
  return {
    goals: [],
    form: { question: '', hypothesis: '', loading: 0 },
    evText: {}, evSrc: {}, evLoading: '',
    statusMessage: '',
    loading: 0,
    detailId: '', detailBody: '',
    csrf: function() { return ((document.querySelector('meta[name=csrf-token]') || {}).content || ''); },
    callApi: function(action, payload) {
      var self = this;
      return fetch('/api/plugins/vibe_trading/research_goals', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': self.csrf() },
        body: JSON.stringify(Object.assign({ action: action }, payload || {})),
      }).then(function(r){ return r.json(); }).catch(function(e){ return { success: 0, error: 'network: ' + (e && e.message) }; });
    },
    // --- shape-tolerant accessors (upstream field names may vary)
    goalId: function(g) { return String((g && (g.goal_id || g.id || g.uuid)) || '?'); },
    goalField: function(g, keys, fb) {
      for (var i = 0; i < keys.length; i++) {
        var v = g && g[keys[i]];
        if (v !== undefined && v !== null && v !== '') return String(v);
      }
      return fb;
    },
    evidenceList: function(g) {
      if (!g) return [];
      var e = g.evidence || g.evidences || g.goal_evidence;
      if (Array.isArray(e)) return e;
      if (e && typeof e === 'object') return Object.values(e);
      return [];
    },
    evidenceCount: function(g) {
      var c = g && g.evidence_count;
      if (typeof c === 'number') return c;
      return this.evidenceList(g).length;
    },
    init: function() {
      this.loadAll();
    },
    loadAll: function() {
      var self = this;
      this.loading = 1;
      this.callApi('list', {}).then(function(res) {
        self.loading = 0;
        if (res && res.success) {
          var d = res.data;
          self.goals = Array.isArray(d) ? d : ((d && (d.goals || d.items)) || []);
          if (!self.goals.length && !Array.isArray(d)) {
            // no list tool on this upstream build: fall back to remembered ids
            self.loadFromRemembered();
          }
        } else {
          self.loadFromRemembered();
        }
      });
    },
    loadFromRemembered: function() {
      var self = this;
      var ids = [];
      try { ids = JSON.parse(localStorage.getItem('vibe_trading_ui.goals.ids') || '[]') || []; } catch (e) { ids = []; }
      if (!ids.length) {
        this.statusMessage = 'Goals unavailable: ' + 'the research-goal tools are not reachable (needs the research-goal tools on the live MCP server)';
        return;
      }
      Promise.all(ids.map(function(id) { return self.callApi('get', { goal_id: id }); })).then(function(rs) {
        self.goals = rs.filter(function(r) { return r && r.success; }).map(function(r) { return r.data || r; });
      });
    },
    rememberGoal: function(id) {
      var ids = [];
      try { ids = JSON.parse(localStorage.getItem('vibe_trading_ui.goals.ids') || '[]') || []; } catch (e) { ids = []; }
      if (ids.indexOf(id) === -1) { ids.push(id); }
      try { localStorage.setItem('vibe_trading_ui.goals.ids', JSON.stringify(ids)); } catch (e) {}
    },
    startGoal: function() {
      var self = this;
      if (!this.form.question.trim()) { this.statusMessage = 'enter a question'; return; }
      this.form.loading = 1;
      this.callApi('start', { question: this.form.question.trim(), hypothesis: this.form.hypothesis.trim() })
        .then(function(res) {
          self.form.loading = 0;
          if (res && res.success) {
            var d = res.data || {};
            var id = String(d.goal_id || d.id || '');
            if (id) self.rememberGoal(id);
            self.statusMessage = 'Goal created' + (id ? ' (' + id + ')' : '');
            self.form.question = ''; self.form.hypothesis = '';
            self.loadAll();
          } else {
            self.statusMessage = 'Create failed: ' + ((res && res.error) || 'unknown');
          }
        });
    },
    addEvidence: function(g) {
      var self = this;
      var id = this.goalId(g);
      var text = (this.evText[id] || '').trim();
      if (!text) { this.statusMessage = 'evidence text required'; return; }
      this.evLoading = id;
      this.callApi('add_evidence', { goal_id: id, evidence: text, source: (this.evSrc[id] || '').trim() })
        .then(function(res) {
          self.evLoading = '';
          if (res && res.success) {
            self.evText[id] = ''; self.evSrc[id] = '';
            self.statusMessage = 'Evidence added to ' + id;
            self.loadAll();
          } else {
            self.statusMessage = 'Add failed: ' + ((res && res.error) || 'unknown');
          }
        });
    },
    setStatus: function(g, status) {
      var self = this;
      if (!status) return;
      var id = this.goalId(g);
      this.callApi('update_status', { goal_id: id, status: status })
        .then(function(res) {
          if (res && res.success) { self.statusMessage = id + ' -> ' + status; self.loadAll(); }
          else { self.statusMessage = 'Status update failed: ' + ((res && res.error) || 'unknown'); }
        });
    },
    openDetail: function(g) {
      var self = this;
      var id = this.goalId(g);
      this.detailId = id;
      this.detailBody = 'loading...';
      this.callApi('get', { goal_id: id }).then(function(res) {
        if (res && res.success) { self.detailBody = JSON.stringify(res.data || res.raw || res, null, 2); }
        else { self.detailBody = 'get failed: ' + ((res && res.error) || 'unknown'); }
      });
    }
  };
}
window.goalsPage = goalsPage;
</script>
<script defer src="/vendor/alpine/alpine.min.js"></script>
</body>
</html>
