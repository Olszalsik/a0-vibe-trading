<!--
Vibe-Trading — page-head injection.

Injects a tiny inline badge into the Agent Zero WebUI head. No JS, no fetch,
no side effects. Just a CSS variable and a meta tag so other plugins (and the
Settings page) can theme the Vibe-Trading section if they want.
-->
<meta name="vibe-trading-plugin" content="vibe_trading v0.2.0" data-registered-by="vibe-trading-plugin" />
<style id="vibe-trading-theme-vars">
  :root {
    --vibe-trading-accent: #4f8cff;
    --vibe-trading-accent-soft: rgba(79, 140, 255, 0.12);
  }
</style>
