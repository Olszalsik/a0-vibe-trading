name: vibe_trading
title: Vibe-Trading
description: Brings HKUDS/Vibe-Trading finance research tooling into Agent Zero as
  a registered MCP server. Exposes 54 research-only tools (backtest, factor analysis,
  options, market data, swarm, trade-journal, shadow-account, 79 finance skills, 452
  alphas) and a dedicated vibe-trader agent profile. Live order placement is opt-in
  and gated.
version: 0.1.10
settings_sections:
- external
- mcp
- agent
per_project_config: false
per_agent_config: true
always_enabled: false
webui:
- main.html
- page.html
- config.html
- dashboard.html
- alphazoo.html
- swarms.html
- shadow.html
- deepdive.html
- skills.html
- risk.html
- journal.html
- shared.js
